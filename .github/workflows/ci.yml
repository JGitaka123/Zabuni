name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: zabuni
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zabuni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      INTEGRATION_MODE: fixture
      DATABASE_URL: postgres://zabuni_app:zabuni_app@localhost:5432/zabuni
      DATABASE_AUTH_URL: postgres://zabuni_auth:zabuni_auth@localhost:5432/zabuni
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/zabuni
      DATABASE_WORKER_URL: postgres://zabuni_worker:zabuni_worker@localhost:5432/zabuni
      MIGRATION_DATABASE_URL: postgres://zabuni_migrator:zabuni_migrator@localhost:5432/zabuni
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision database roles
        run: |
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/local/postgres/03-pgvector.sql
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/local/postgres/00-roles.sql
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/local/postgres/01-auth-role.sql
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/local/postgres/02-worker-role.sql
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
